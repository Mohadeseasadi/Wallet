services:
  postgres:
    image: postgres:17
    container_name: wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data

volumes:
  wallet_postgres_data: